name: Activate Auto-Merge on a PR

on:
  pull_request_target:
  workflow_call:
    inputs:
      mode:
        description: "Select merge mode. Options are squash and rebase. Default is rebase"
        default: "rebase"
        type: string
    secrets:
      GREENBONE_BOT_TOKEN:
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge for open PRs
        uses: greenbone/actions/auto-merge@v3
        with:
          mode: ${{ inputs.mode }}
          github-token: ${{secrets.GREENBONE_BOT_TOKEN}}
