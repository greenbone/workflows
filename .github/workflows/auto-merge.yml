name: Activate Auto-Merge (Squash) on a PR

on:
  pull_request_target:
  workflow_call:
    inputs:
      mode:
        description: "Select merge mode. Options are squash and rebase. Default is rebase"
        default: "rebase"
        type: string
    secrets:
      GREENBONE_BOT_TOKEN:
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge for open PRs
        run: |
          MERGE_METHOD="$(gh pr view "$PR_URL" --json autoMergeRequest --jq '.autoMergeRequest.mergeMethod // ""')"

          if [ -n "$MERGE_METHOD" ]; then
            echo "Auto-merge is already enabled with method: $MERGE_METHOD"
            exit 0
          fi

          gh pr merge --auto --rebase "$PR_URL"
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GITHUB_TOKEN: ${{secrets.GREENBONE_BOT_TOKEN}}
