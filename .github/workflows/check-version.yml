name: Check project versioning

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python version to use"
        default: "3.10"
        type: string

jobs:
  check-version:
    name: Check versioning for consistency
    runs-on: "ubuntu-latest"
    steps:
      - uses: greenbone/actions/check-version@80a38a10bb7eb2b3c12f7f0361532dc6120342d6  # v3.36.20
        with:
          python-version: ${{ inputs.python-version }}
