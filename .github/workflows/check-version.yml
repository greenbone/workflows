name: Check project versioning

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python version to use"
        default: "3.10"
        type: string

jobs:
  check-version:
    name: Check versioning for consistency
    runs-on: "ubuntu-latest"
    steps:
      - uses: greenbone/actions/check-version@135c9afb4657e195cfb0bbdbffbb136cc72f8bc8  # v3.36.22
        with:
          python-version: ${{ inputs.python-version }}
