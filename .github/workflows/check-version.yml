name: Check project versioning

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python version to use"
        default: "3.11"
        type: string

jobs:
  check-version:
    name: Check versioning for consistency
    runs-on: "ubuntu-latest"
    steps:
      - uses: greenbone/actions/check-version@c28cd1740972049d898f7ea2cdd871a94bd9bd77  # v3.36.24
        with:
          python-version: ${{ inputs.python-version }}
