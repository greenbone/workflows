name: Check project versioning

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python version to use"
        default: "3.10"
        type: string

jobs:
  check-version:
    name: Check versioning for consistency
    runs-on: "ubuntu-latest"
    steps:
      - uses: greenbone/actions/check-version@8d52f083cdd1def097375ae24bff575a47d6642e  # v3.36.21
        with:
          python-version: ${{ inputs.python-version }}
