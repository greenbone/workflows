name: Check project versioning

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python version to use"
        default: "3.10"
        type: string

jobs:
  check-version:
    name: Check versioning for consistency
    runs-on: "ubuntu-latest"
    steps:
      - uses: greenbone/actions/check-version@d79ec6dd087a94ad9ef5211ab86dcf17414b252d  # v3.36.19
        with:
          python-version: ${{ inputs.python-version }}
